name: runneradmin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runneradmin-rdp
  cancel-in-progress: true

jobs:
  secure-rdp:
    # Requires a larger runner with this label.
    # Use windows-latest if this label is unavailable.
    runs-on: windows-2022-16core
    timeout-minutes: 360

    env:
      TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rdpFirewallRule = "RDP-Tailscale"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule `
            name="$rdpFirewallRule" |
            Out-Null

          netsh advfirewall firewall add rule `
            name="$rdpFirewallRule" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10 `
            profile=any

          Restart-Service `
            -Name TermService `
            -Force

          $rdpService = Get-Service `
            -Name TermService `
            -ErrorAction Stop

          if ($rdpService.Status -ne "Running") {
            throw "Remote Desktop service failed to start."
          }

          Write-Host "Remote Desktop is enabled."

      - name: Create runneradmin User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rdpUsername = "runneradmin"
          $characters = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*_-+="
          $passwordLength = 24

          $random = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $bytes = New-Object byte[] $passwordLength
          $random.GetBytes($bytes)
          $random.Dispose()

          $password = -join ($bytes | ForEach-Object {
            $characters[$_ % $characters.Length]
          })

          # Make the password available to later steps.
          # This version intentionally does not mask it.
          "RDP_PASSWORD=$password" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          $securePassword = ConvertTo-SecureString `
            -String $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $rdpUsername `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {
            New-LocalUser `
              -Name $rdpUsername `
              -Password $securePassword `
              -AccountNeverExpires `
              -Description "Temporary GitHub Actions RDP user"
          }
          else {
            Set-LocalUser `
              -Name $rdpUsername `
              -Password $securePassword

            Enable-LocalUser `
              -Name $rdpUsername
          }

          $groupMembers = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue

          $alreadyAllowed = $groupMembers |
            Where-Object {
              $_.Name -match "\\runneradmin$"
            }

          if ($null -eq $alreadyAllowed) {
            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "$env:COMPUTERNAME\$rdpUsername"
          }

          $verifiedUser = Get-LocalUser `
            -Name $rdpUsername `
            -ErrorAction SilentlyContinue

          if ($null -eq $verifiedUser) {
            throw "The runneradmin user could not be created or found."
          }

          Write-Host "RDP username configured: $rdpUsername"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tailscaleVersion = "1.102.3"
          $tailscaleUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-$tailscaleVersion-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest `
            -Uri $tailscaleUrl `
            -OutFile $installerPath

          $install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              $installerPath,
              "/qn",
              "/norestart"
            ) `
            -Wait `
            -PassThru

          Remove-Item `
            -Path $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

          if ($install.ExitCode -ne 0) {
            throw "Tailscale installation failed with exit code $($install.ExitCode)."
          }

          $tailscale = Join-Path `
            ${env:ProgramFiles} `
            "Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found at $tailscale."
          }

          Write-Host "Tailscale $tailscaleVersion installed."

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = Join-Path `
            ${env:ProgramFiles} `
            "Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw "The TAILSCALE_AUTH_KEY repository secret is not configured."
          }

          $tailscaleService = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscaleService) {
            throw "The Tailscale service was not found."
          }

          if ($tailscaleService.Status -ne "Running") {
            Start-Service -Name "Tailscale"
          }

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $tailscaleService = Get-Service `
              -Name "Tailscale" `
              -ErrorAction SilentlyContinue

            if ($null -ne $tailscaleService -and $tailscaleService.Status -eq "Running") {
              break
            }

            Start-Sleep -Seconds 5
          }

          if ($tailscaleService.Status -ne "Running") {
            throw "The Tailscale service failed to start."
          }

          & $tailscale up `
            "--auth-key=$env:TS_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID" `
            "--unattended=true" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale failed to connect."
          }

          $tailscaleIp = ""

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $ipOutput = & $tailscale ip -4
            $tailscaleIp = [string]($ipOutput | Select-Object -First 1)
            $tailscaleIp = $tailscaleIp.Trim()

            if ($tailscaleIp -match "^\d{1,3}(\.\d{1,3}){3}$") {
              break
            }

            Start-Sleep -Seconds 5
          }

          if ($tailscaleIp -notmatch "^\d{1,3}(\.\d{1,3}){3}$") {
            throw "Tailscale did not assign a valid IPv4 address."
          }

          "TAILSCALE_IP=$tailscaleIp" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $tailscaleIp"

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            throw "TAILSCALE_IP is empty."
          }

          Write-Host "Testing RDP on $env:TAILSCALE_IP:3389"

          $connected = $false

          for ($attempt = 1; $attempt -le 6; $attempt++) {
            $connected = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            if ($connected) {
              break
            }

            Write-Host "RDP is not ready. Retrying..."
            Start-Sleep -Seconds 5
          }

          if (-not $connected) {
            throw "TCP connection to RDP port 3389 failed."
          }

          Write-Host "RDP is accessible over Tailscale."

      - name: Display RDP Credentials
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "             RDP ACCESS"
          Write-Host "========================================"
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: runneradmin"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "========================================"
          Write-Host ""

      - name: Maintain Connection
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format o)] RDP active"
            Start-Sleep -Seconds 300
          }
